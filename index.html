<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Per-basin split audit</title>
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --fg:#202124; --muted:#666;
    --panel:#f5f6f7; --border:#c9ccd1; --accent:#2667a8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17191c; --fg:#f2f2f2;
    --muted:#b6b8bd; --panel:#22252a; --border:#454a52; --accent:#73aee8; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
    font-family:Arial,sans-serif; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:12px; }
  label { display:grid; gap:4px; font-size:13px; color:var(--muted); }
  input,select,button { font:inherit; padding:7px 9px; border:1px solid var(--border);
    border-radius:5px; background:var(--panel); color:var(--fg); }
  button { cursor:pointer; }
  .summary { margin:4px 0 12px; color:var(--muted); }
  .viewer { display:grid; grid-template-columns:minmax(220px,28%) minmax(0,1fr); gap:14px; }
  .list { height:72vh; overflow:auto; border:1px solid var(--border); }
  .item { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--border);
    border-radius:0; padding:8px 10px; }
  .item[aria-selected="true"] { background:var(--accent); color:white; }
  .meta { margin:0 0 8px; font-size:13px; color:var(--muted); }
  .full { display:inline-block; margin:0 0 8px; }
  img { display:block; max-width:100%; height:auto; border:1px solid var(--border); }
  @media (max-width:760px) { .viewer { grid-template-columns:1fr; } .list { height:240px; } }
</style>
</head>
<body>
<h1>Per-basin upstream/downstream split audit</h1>
<div class="summary">T600 valid 1,009 / 1,083; common valid across all five thresholds 1,003</div>

    <option value="invalid_other">Invalid: other</option>
    <option value="valid_T600">Valid T600</option></select></label>
  <label>All-five validity<select id="common"><option value="all">All</option>

  <label>Review class<select id="risk"><option value="all">All</option>
    <option value="T600_invalid">T600 strict-invalid</option>
    <option value="threshold_validity_change">Validity changes by threshold</option>
    <option value="label_change">Labels change by threshold</option>
    <option value="stable">Stable</option></select></label>
  <button id="prev" type="button">Previous</button><button id="next" type="button">Next</button>
</div>
<div id="shown" class="summary"></div>
<div class="viewer"><div id="list" class="list"></div><main>

</main></div>

const search=document.getElementById('search'), status=document.getElementById('status');
const common=document.getElementById('common'), risk=document.getElementById('risk');
const list=document.getElementById('list'), openPlot=document.getElementById('openPlot');
const imageLink=document.getElementById('imageLink');
const shown=document.getElementById('shown'), plot=document.getElementById('plot');
const meta=document.getElementById('meta'); let filtered=[], selected=0;
function selectIndex(i){ if(!filtered.length)return; selected=Math.max(0,Math.min(i,filtered.length-1));
  const r=filtered[selected]; plot.src=r.plot; plot.alt=`Basin ${r.id} split audit`;
  openPlot.href=r.plot; imageLink.href=r.plot;
  meta.textContent=`${selected+1}/${filtered.length} · PFAF ${r.id} · ${r.review} · ${r.status} · `+
    `outlets=${r.outlets} · children=${r.children} · changed=${r.changed} · ${r.reason}`;
  [...list.children].forEach((b,j)=>b.setAttribute('aria-selected',j===selected?'true':'false'));
  list.children[selected]?.scrollIntoView({block:'nearest'});
}
function render(){ const q=search.value.trim(); filtered=rows.filter(r=>(!q||String(r.id).includes(q))&&
  (status.value==='all'||r.status===status.value)&&(risk.value==='all'||r.review===risk.value)&&
  (common.value==='all'||(common.value==='yes')===r.common));
  shown.textContent=`Showing ${filtered.length} basins`; list.replaceChildren();
  filtered.forEach((r,i)=>{const b=document.createElement('button');b.type='button';b.className='item';
    b.textContent=`${r.id} · ${r.review} · outlets ${r.outlets}`;b.onclick=()=>selectIndex(i);list.appendChild(b);});
  selected=0; if(filtered.length)selectIndex(0); else{plot.removeAttribute('src');openPlot.removeAttribute('href');
    imageLink.removeAttribute('href');meta.textContent='No matches';}
}
[search,status,common,risk].forEach(e=>e.addEventListener('input',render));
document.getElementById('prev').onclick=()=>selectIndex(selected-1);
document.getElementById('next').onclick=()=>selectIndex(selected+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')selectIndex(selected-1);if(e.key==='ArrowRight')selectIndex(selected+1);});
render();
</script>
